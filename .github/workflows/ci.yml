name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast, deterministic unit tests -- no LLM calls, no secrets needed.
  # Always runs, including on PRs from forks (which don't get repo secrets).
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests
        run: uv run pytest -q --ignore=tests/evals

  # End-to-end DeepEval suite: real LLM calls (classify + injection guard +
  # LLM-as-judge grading), so it needs ANTHROPIC_API_KEY. Add it in this
  # repo's Settings -> Secrets and variables -> Actions -> New repository
  # secret (name: ANTHROPIC_API_KEY). Separated from unit-tests because it's
  # slower, costs API usage, and forked-repo PRs won't have the secret.
  evals:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync

      - name: Run DeepEval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
        run: uv run deepeval test run tests/evals/test_issue_classifier.py
