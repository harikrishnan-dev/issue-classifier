<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Issue Resolver</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel-bg: #ffffff;
    --border: #e1e4e8;
    --text: #1f2328;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-light: #eef2ff;
    --bubble-user: #4f46e5;
    --bubble-user-text: #ffffff;
    --bubble-bot: #f1f2f6;
    --bubble-bot-text: #1f2328;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }

  .layout {
    display: grid;
    grid-template-columns: 1.2fr 0.8fr;
    height: 100vh;
  }

  /* ---- Chat column ---- */
  .chat-column {
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    background: var(--panel-bg);
  }

  .chat-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }

  .chat-header h1 {
    font-size: 16px;
    margin: 0;
  }

  .chat-header p {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--muted);
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .message {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .message.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: var(--bubble-user-text);
    border-bottom-right-radius: 4px;
  }

  .message.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    color: var(--bubble-bot-text);
    border-bottom-left-radius: 4px;
  }

  .message.typing {
    align-self: flex-start;
    color: var(--muted);
    font-style: italic;
  }

  .chat-input {
    display: flex;
    gap: 8px;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
  }

  .chat-input textarea {
    flex: 1;
    resize: none;
    height: 44px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    outline: none;
  }

  .chat-input textarea:focus {
    border-color: var(--accent);
  }

  .chat-input button {
    padding: 0 20px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .chat-input button:disabled {
    background: #c7c9f2;
    cursor: not-allowed;
  }

  /* ---- Results column ---- */
  .results-column {
    background: var(--bg);
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .results-header h2 {
    font-size: 15px;
    margin: 0 0 4px;
  }

  .results-header p {
    margin: 0;
    font-size: 12px;
    color: var(--muted);
  }

  .result-card {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }

  .result-card .query {
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 6px;
  }

  .result-card .redacted {
    font-size: 12px;
    color: var(--text);
    background: var(--accent-light);
    border-radius: 6px;
    padding: 6px 8px;
    margin: 0 0 10px;
  }

  .result-card .redacted .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--accent);
    font-weight: 600;
    display: block;
    margin-bottom: 2px;
  }

  .metrics-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .metric {
    background: var(--accent-light);
    border-radius: 8px;
    padding: 8px 10px;
  }

  .metric .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--accent);
    font-weight: 600;
  }

  .metric .value {
    font-size: 14px;
    font-weight: 600;
    margin-top: 2px;
  }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }

  .badge.priority-high { background: #fee2e2; color: #b91c1c; }
  .badge.priority-medium { background: #fef3c7; color: #92400e; }
  .badge.priority-low { background: #dcfce7; color: #166534; }

  .badge.sentiment-negative { background: #fee2e2; color: #b91c1c; }
  .badge.sentiment-neutral { background: #e5e7eb; color: #374151; }
  .badge.sentiment-positive { background: #dcfce7; color: #166534; }

  .reasoning-section {
    margin-top: 12px;
  }

  .reasoning-section .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 6px;
  }

  .reasoning-section .text {
    font-size: 13px;
    line-height: 1.5;
    color: var(--text);
    background: #fafafa;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }

  .empty-state {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    margin-top: 40px;
  }
</style>
</head>
<body>

<div class="layout">

  <!-- Chat column -->
  <div class="chat-column">
    <div class="chat-header">
      <h1>Issue Resolver</h1>
      <p>Describe an issue and get it triaged</p>
    </div>

    <div class="messages" id="messages">
      <div class="message bot">Hi! Describe the issue you're seeing and I'll classify and triage it for you.</div>
    </div>

    <div class="chat-input">
      <textarea id="chat-text" placeholder="Describe your issue..."></textarea>
      <button id="send-btn">Send</button>
    </div>
  </div>

  <!-- Results column -->
  <div class="results-column">
    <div class="results-header">
      <h2>Triage Results</h2>
      <p>Latest analysis for each message you send</p>
    </div>

    <div id="results-list">
      <div class="empty-state">No results yet. Send a message to see triage details here.</div>
    </div>
  </div>

</div>

<script>
  const messagesEl = document.getElementById('messages');
  const resultsListEl = document.getElementById('results-list');
  const chatText = document.getElementById('chat-text');
  const sendBtn = document.getElementById('send-btn');

  function addMessage(text, sender) {
    const el = document.createElement('div');
    el.className = 'message ' + sender;
    el.textContent = text;
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return el;
  }

  function priorityClass(priority) {
    return 'priority-' + (priority || 'low').toLowerCase();
  }

  function sentimentClass(sentiment) {
    return 'sentiment-' + (sentiment || 'neutral').toLowerCase();
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function renderResult(query, result) {
    if (resultsListEl.querySelector('.empty-state')) {
      resultsListEl.innerHTML = '';
    }

    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = `
      <p class="query">"${escapeHtml(query)}"</p>
      <div class="redacted">
        <span class="label">PII-Redacted</span>
        ${escapeHtml(result.redactedMessage)}
      </div>
      <div class="metrics-grid">
        <div class="metric">
          <div class="label">Token Count</div>
          <div class="value">${result.tokenCount}</div>
        </div>
        <div class="metric">
          <div class="label">Category</div>
          <div class="value">${escapeHtml(result.category)}</div>
        </div>
        <div class="metric">
          <div class="label">Assigned Team</div>
          <div class="value">${escapeHtml(result.assignedTeam)}</div>
        </div>
        <div class="metric">
          <div class="label">Sentiment</div>
          <div class="value"><span class="badge ${sentimentClass(result.sentiment)}">${escapeHtml(result.sentiment)}</span></div>
        </div>
        <div class="metric" style="grid-column: 1 / -1;">
          <div class="label">Priority</div>
          <div class="value"><span class="badge ${priorityClass(result.priority)}">${escapeHtml(result.priority)}</span></div>
        </div>
      </div>
      <div class="reasoning-section">
        <div class="label">Reasoning</div>
        <div class="text">${escapeHtml(result.reasoning)}</div>
      </div>
    `;
    resultsListEl.prepend(card);
  }

  // Backend served by src/frontend/backend_api.py:
  //   uvicorn src.frontend.backend_api:app --reload --port 8000
  const API_URL = 'http://localhost:8000/analyze';

  async function analyze(text) {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });
    if (!response.ok) {
      throw new Error(`API error: ${response.status}`);
    }
    const data = await response.json();
    return {
      redactedMessage: data.redacted_message,
      tokenCount: data.token_count,
      category: data.category,
      assignedTeam: data.assigned_team,
      sentiment: data.sentiment,
      priority: data.priority,
      reasoning: data.reasoning,
    };
  }

  async function handleSend() {
    const text = chatText.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    chatText.value = '';
    sendBtn.disabled = true;

    const typingEl = addMessage('Analyzing...', 'bot typing');

    try {
      const result = await analyze(text);
      typingEl.remove();
      addMessage(`Got it — logged as a ${result.priority} priority ${result.category.replace('_', ' ')}, routed to ${result.assignedTeam}.`, 'bot');
      renderResult(text, result);
    } catch (err) {
      typingEl.remove();
      addMessage(`Sorry, I couldn't reach the backend (${err.message}). Is backend_api.py running on port 8000?`, 'bot');
    } finally {
      sendBtn.disabled = false;
      chatText.focus();
    }
  }

  sendBtn.addEventListener('click', handleSend);
  chatText.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });
</script>

</body>
</html>
