[project]
name = "issue-classifier"
version = "0.1.0"
description = "Stateless issue-triage pipeline: PII redaction, prompt-injection screening, and team routing, built with LangGraph."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langgraph>=1.2.11",
    "langgraph-api>=0.13.4",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langgraph-cli>=0.4.31",
    "langgraph-sdk>=0.4.4",
    "langchain-anthropic>=0.3.0",
    "langsmith>=0.12.1",
    "python-dotenv>=1.2.3",
    "pydantic>=2.13.5",
    "pre-commit>=4.6.2",
    "presidio>=2.2.364",
    "en-core-web-sm",
    "fastapi>=0.141.1",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "deepeval>=4.2.2",
    "pytest>=9.1.1",
]
